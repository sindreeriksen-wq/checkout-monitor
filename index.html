    /* ── Lightweight Chakra UI stubs ──────────────────────────────────────────
       Converts Chakra-style props (mb, px, bg, borderRadius…) to inline CSS
       so the portal React component works without the real Chakra library.   */

    const _sp = v => { if (v == null) return undefined; if (typeof v === 'string') return v; return (v * 4) + 'px'; };
    const _br = v => { if (v == null) return undefined; if (typeof v === 'string') return v; return v + 'px'; };

    const CHAKRA_KEYS = new Set([
      'm','mt','mb','ml','mr','mx','my','p','pt','pb','pl','pr','px','py',
      'w','h','minW','maxW','minH','maxH','bg','color',
      'border','borderTop','borderBottom','borderLeft','borderRight','borderRadius','borderColor',
      'fontSize','fontWeight','textTransform','textAlign','whiteSpace','lineHeight','fontFamily',
      'display','overflow','overflowX','overflowY','flex','flexWrap','flexDirection',
      'alignItems','justifyContent','cursor','verticalAlign','textDecoration',
      'opacity','position','top','left','right','bottom','zIndex',
      'gap','align','justify',
    ]);

    const _css = p => {
      const s = {};
      if (p.m  != null) s.margin = _sp(p.m);
      if (p.mt != null) s.marginTop = _sp(p.mt);
      if (p.mb != null) s.marginBottom = _sp(p.mb);
      if (p.ml != null) s.marginLeft = _sp(p.ml);
      if (p.mr != null) s.marginRight = _sp(p.mr);
      if (p.mx != null) { s.marginLeft = _sp(p.mx); s.marginRight = _sp(p.mx); }
      if (p.my != null) { s.marginTop = _sp(p.my); s.marginBottom = _sp(p.my); }

      if (p.pl != null) s.paddingLeft = _sp(p.pl);
      if (p.pr != null) s.paddingRight = _sp(p.pr);
      if (p.px != null) { s.paddingLeft = _sp(p.px); s.paddingRight = _sp(p.px); }
      if (p.py != null) { s.paddingTop = _sp(p.py); s.paddingBottom = _sp(p.py); }
      if (p.w  != null) s.width = _sp(p.w);
      if (p.h  != null) s.height = _sp(p.h);
      if (p.minW != null) s.minWidth = _sp(p.minW);
      if (p.maxW != null) s.maxWidth = _sp(p.maxW);
      if (p.minH != null) s.minHeight = _sp(p.minH);
      if (p.maxH != null) s.maxHeight = _sp(p.maxH);
      if (p.bg   != null) s.background = p.bg;
      if (p.color != null) s.color = p.color;
      if (p.border != null) s.border = p.border;
      if (p.borderTop != null) s.borderTop = p.borderTop;
      if (p.borderBottom != null) s.borderBottom = p.borderBottom;
      if (p.borderLeft != null) s.borderLeft = p.borderLeft;
      if (p.borderRight != null) s.borderRight = p.borderRight;
      if (p.borderRadius != null) s.borderRadius = _br(p.borderRadius);
      if (p.borderColor != null) s.borderColor = p.borderColor;
      if (p.fontSize != null) s.fontSize = p.fontSize;
      if (p.fontWeight != null) s.fontWeight = p.fontWeight;
      if (p.textTransform != null) s.textTransform = p.textTransform;
      if (p.textAlign != null) s.textAlign = p.textAlign;
      if (p.whiteSpace != null) s.whiteSpace = p.whiteSpace;
      if (p.lineHeight != null) s.lineHeight = p.lineHeight;
      if (p.fontFamily != null) s.fontFamily = p.fontFamily;
      if (p.display != null) s.display = p.display;
      if (p.overflow != null) s.overflow = p.overflow;
      if (p.overflowX != null) s.overflowX = p.overflowX;
      if (p.overflowY != null) s.overflowY = p.overflowY;
      if (p.flex != null) s.flex = p.flex;
      if (p.flexWrap != null) s.flexWrap = p.flexWrap;
      if (p.flexDirection != null) s.flexDirection = p.flexDirection;
      if (p.alignItems != null) s.alignItems = p.alignItems;
      if (p.justifyContent != null) s.justifyContent = p.justifyContent;
      if (p.cursor != null) s.cursor = p.cursor;
      if (p.verticalAlign != null) s.verticalAlign = p.verticalAlign;
      if (p.textDecoration != null) s.textDecoration = p.textDecoration;
      if (p.opacity != null) s.opacity = p.opacity;
      if (p.position != null) s.position = p.position;
      if (p.top != null) s.top = p.top;
      if (p.left != null) s.left = p.left;
      if (p.right != null) s.right = p.right;
      if (p.bottom != null) s.bottom = p.bottom;
      if (p.zIndex != null) s.zIndex = p.zIndex;
      return s;
    };

    const _html = props => {
      const out = {};
      for (const [k, v] of Object.entries(props)) {
        if (!CHAKRA_KEYS.has(k) && k !== 'children') out[k] = v;
      }
      return out;
    };

    const Box = ({ children, style: sx, ...p }) =>
      <div style={{ ..._css(p), ...sx }} {..._html(p)}>{children}</div>;

    const Text = ({ children, style: sx, ...p }) =>
      <span style={{ ..._css(p), ...sx }} {..._html(p)}>{children}</span>;

    const Flex = ({ children, style: sx, gap, align, justify, ...p }) =>
      <div style={{
        display: 'flex',
        ...(gap  != null ? { gap: _sp(gap) } : {}),
        ...(align   ? { alignItems: align } : {}),
        ...(justify ? { justifyContent: justify } : {}),
        ..._css(p), ...sx,
      }} {..._html(p)}>{children}</div>;

        telenor:     ["Permanent manual check — BankID blocks automation."],
      },
      scanNotes: {
        tise: "Marketplace. Instabox confirmed: Small 29 NOK, Medium 49 NOK, Large 89 NOK. WAF blocks buyer flow from cloud IPs — competitor prices unavailable without Norwegian IP.",
        ankerstjerne: "Shopify. 9 delivery options. Instabox pos 1 (39 NOK), Porterbuddy pos 7–9 (90 NOK, 3 day-slots).",
        telenor: "Permanent manual check — BankID required at checkout.",
        match: "Scanned with 119 NOK product (on sale). Free shipping threshold at Match is 600 NOK.",
        decades: "Scanned with 119 NOK product (on sale). Free shipping threshold at Decades is 800 NOK.",
        vic: "All sizes of Lloyd Chinos (dark-navy) sold out — could not add to cart. Delivery options inferred from Match/Decades (same Voice/Jean Paul checkout platform). Update product URL for next scan.",
        getinspired: "Product URL updated to Meraki Hand Soap 490ml (previous product unavailable). Klarna/Kustom iframe checkout. All 8 options confirmed unchanged from W38.",
      },
    },
  };

  // ── STATE ───────────────────────────────────────────────────────────────────
  const [activeWeek, setActiveWeek]       = useState(WEEKS[WEEKS.length - 1]);
  const [activeClientId, setActiveClientId] = useState("villoid");
  const [activeBrandId, setActiveBrandId]   = useState(null);
  const [lightbox, setLightbox]             = useState(null);

  const wd = WEEK_DATA[activeWeek];
  const { clients, allData, summaries, scanNotes } = wd;
  const activeClient = clients.find(c => c.id === activeClientId);
  const isGroup = activeClient?.type === "group";

  const getDataForId = id => allData[id] || [];

  // ── HELPERS ─────────────────────────────────────────────────────────────────
  const sc   = s => s==="success"?"#22c55e":s==="partial"?"#f59e0b":"#ef4444";
  const sBg  = s => s==="success"?"#dcfce7":s==="partial"?"#fef3c7":"#fee2e2";
  const sTxt = s => s==="success"?"#16a34a":s==="partial"?"#d97706":"#dc2626";
  const sLbl = s => s==="success"?"✓ Scanned":s==="partial"?"⚠ Partial":s==="manual_needed"?"✋ Manual":"✗ Error";
  const dot  = s => <span style={{display:"inline-block",width:7,height:7,borderRadius:"50%",background:sc(s),marginLeft:5,verticalAlign:"middle"}}/>;
  const priceStr = p => p===0?"Free":`${p} NOK`;
  const posCircle = pos => ({display:"inline-flex",alignItems:"center",justifyContent:"center",width:24,height:24,borderRadius:"50%",fontWeight:700,fontSize:11,background:pos===1?"#fbbf24":pos===2?"#d1d5db":"#f3f4f6",color:"#111827",flexShrink:0});
  const iBadge = {display:"inline-block",padding:"1px 6px",borderRadius:999,fontSize:10,fontWeight:700,background:"#16a34a",color:"white",marginLeft:4};

  // ── GROUP OVERVIEW ───────────────────────────────────────────────────────────
  const renderGroupOverview = () => (
    <Box>
      <Box mb={3}><Text fontSize="14px" fontWeight={700} color="#0f172a">{activeClient.name} — All brands</Text><Text fontSize="12px" color="#64748b">Click a row to drill in</Text></Box>
      <Box bg="white" border="1px solid #e2e8f0" borderRadius="10px" overflow="hidden">
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
          <thead><tr style={{background:"#f8fafc",borderBottom:"1px solid #e2e8f0"}}>
            {["Brand","Porterbuddy","Instabox","Cheapest competitor","Options","Status",""].map(h=><th key={h} style={{padding:"8px 14px",textAlign:"left",color:"#64748b",fontWeight:600,fontSize:11,textTransform:"uppercase"}}>{h}</th>)}
          </tr></thead>
          <tbody>
            {activeClient.brands.map(brand => {
              const data = getDataForId(brand.id);
              const pb = data.find(d=>d.provider==="Porterbuddy");
              const ib = data.find(d=>d.provider==="Instabox");
              const cc = data.filter(d=>d.cat==="competitor").sort((a,b)=>a.price-b.price)[0];
              return (
                <tr key={brand.id} onClick={()=>setActiveBrandId(brand.id)} style={{borderBottom:"1px solid #f1f5f9",cursor:"pointer"}}
                  onMouseEnter={e=>e.currentTarget.style.background="#f8fafc"} onMouseLeave={e=>e.currentTarget.style.background="white"}>
                  <td style={{padding:"10px 14px"}}><Text fontWeight={600} color="#0f172a">{brand.name}</Text><Text fontSize="11px" color="#94a3b8">{brand.url}</Text></td>
                  <td style={{padding:"10px 14px"}}>{pb?<Flex align="center" gap={2}><span style={posCircle(pb.pos)}>{pb.pos}</span><Text fontSize="12px" color="#16a34a" fontWeight={600}>{priceStr(pb.price)}</Text></Flex>:<Text color="#cbd5e1" fontSize="12px">—</Text>}</td>
                  <td style={{padding:"10px 14px"}}>{ib?<Flex align="center" gap={2}><span style={posCircle(ib.pos)}>{ib.pos}</span><Text fontSize="12px" color="#16a34a" fontWeight={600}>{priceStr(ib.price)}</Text></Flex>:<Text color="#cbd5e1" fontSize="12px">—</Text>}</td>
                  <td style={{padding:"10px 14px"}}>{cc?<Text fontSize="12px" color="#64748b">{cc.provider} — {priceStr(cc.price)}</Text>:<Text color="#cbd5e1" fontSize="12px">—</Text>}</td>
                  <td style={{padding:"10px 14px"}}><Text fontWeight={600}>{data.length||"—"}</Text></td>
                  <td style={{padding:"10px 14px"}}><Box display="inline-block" px={2} py="2px" bg={sBg(brand.status)} borderRadius={999} fontSize={11} fontWeight={600} color={sTxt(brand.status)}>{sLbl(brand.status)}</Box></td>
                  <td style={{padding:"10px 14px",textAlign:"right"}}><Text fontSize="12px" color="#7c3aed" fontWeight={600}>View →</Text></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </Box>
    </Box>
  );

  // ── DETAIL VIEW ──────────────────────────────────────────────────────────────
  const renderDetail = (id, url, status) => {
    const data = getDataForId(id);
    const instabeeRows = data.filter(d=>d.cat==="instabee");
    const note = scanNotes[id];
    const isTise = id==="tise";
    const wMeta = WEEK_META[activeWeek];

    if ((status!=="success"&&status!=="partial")||(data.length===0&&status!=="partial")) {
      return (
        <Box bg="white" border="1px solid #e2e8f0" borderRadius="10px" p={8} textAlign="center">
          <Text fontSize="36px" mb={3}>{status==="manual_needed"?"⚠️":"❌"}</Text>
          <Text fontWeight={700} color="#0f172a" fontSize="16px">{status==="manual_needed"?"Manual check required":"No data"}</Text>
          <Text color="#64748b" fontSize="13px" mt={1}>{url}</Text>
          {note&&<Box mt={4} bg="#fef9ef" border="1px solid #fde68a" borderRadius="8px" p={4} textAlign="left" maxW={520} mx="auto"><Text fontSize="12px" color="#78350f">{note}</Text></Box>}
        </Box>
      );
    }
    if (!data.length) return <Box bg="white" border="1px solid #e2e8f0" borderRadius="10px" p={8} textAlign="center"><Text fontSize="36px">⚠️</Text><Text fontWeight={700}>Partial scan</Text>{note&&<Box mt={4} bg="#fef9ef" border="1px solid #fde68a" borderRadius="8px" p={4}><Text fontSize="12px" color="#78350f">{note}</Text></Box>}</Box>;

    const minPrice = Math.min(...data.map(d=>d.price));
    const cheapest = data.find(d=>d.price===minPrice);

    return (
      <Box>
        {/* Stat cards */}
        <Flex gap={3} mb={4} flexWrap="wrap">
          <Box bg="white" border="1px solid #e2e8f0" borderRadius="10px" p={4} flex="1" minW="100px">
            <Text fontSize="11px" color="#64748b" fontWeight={600} textTransform="uppercase">Options</Text>
            <Text fontSize="28px" fontWeight={700} color="#0f172a">{isTise?"3 tiers":data.length}</Text>
          </Box>
          {instabeeRows.map((r,i)=>(
            <Box key={i} bg="#f0fdf4" border="1px solid #bbf7d0" borderRadius="10px" p={4} flex="1" minW="100px">
              <Text fontSize="11px" color="#16a34a" fontWeight={600} textTransform="uppercase">{r.provider}{isTise?` (${r.sizeTier})`:""}</Text>
              <Text fontSize="28px" fontWeight={700} color="#16a34a">#{r.pos}</Text>
              <Text fontSize="12px" color="#4ade80">{priceStr(r.price)} · {r.days}</Text>
            </Box>
          ))}
          <Box bg="white" border="1px solid #e2e8f0" borderRadius="10px" p={4} flex="1" minW="100px">
            <Text fontSize="11px" color="#64748b" fontWeight={600} textTransform="uppercase">Cheapest</Text>
            <Text fontSize="28px" fontWeight={700} color="#0f172a">{priceStr(minPrice)}</Text>
            <Text fontSize="12px" color="#94a3b8">{cheapest?.provider} (pos {cheapest?.pos})</Text>
          </Box>
        </Flex>

        {/* Key observations */}
        {summaries[id]?.length>0&&(
          <Box mb={4} bg="#fffbeb" border="1px solid #fde68a" borderRadius="10px" p={4}>
            <Text fontWeight={600} color="#92400e" mb={2} fontSize="13px">💡 Key observations — {wMeta.label}</Text>
            {summaries[id].map((l,i)=><Text key={i} fontSize="12px" color="#78350f" mt={i?1:0}>• {l}</Text>)}
          </Box>
        )}

        {note&&<Box mb={4} bg="#fffbeb" border="1px solid #fde68a" borderRadius="8px" p={3}><Text fontSize="12px" color="#78350f">ℹ️ {note}</Text></Box>}

        {/* Delivery table */}
        <Box bg="white" border="1px solid #e2e8f0" borderRadius="10px" overflow="hidden">
          <Box px={5} py={3} borderBottom="1px solid #f1f5f9" bg="#fafafa">
            <Text fontWeight={600} color="#0f172a" fontSize="14px">Delivery options</Text>
          </Box>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead><tr style={{background:"#f8fafc",borderBottom:"1px solid #e2e8f0"}}>
              {(isTise?["Size tier","Provider","Min. price","Options included","Lead time"]:["#","Provider","Lead time","Price"]).map((h,i)=>(
                <th key={h} style={{padding:"8px 14px",textAlign:i===(isTise?4:3)?"right":"left",color:"#64748b",fontWeight:600,fontSize:11,textTransform:"uppercase"}}>{h}</th>
              ))}
            </tr></thead>
            <tbody>
              {data.map((row,idx)=>(
                <tr key={idx} style={{background:row.cat==="instabee"?"#f0fdf4":"white",borderBottom:"1px solid #f1f5f9"}}>
                  {isTise?(
                    <>
                      <td style={{padding:"9px 14px",fontWeight:600,color:"#374151"}}>{row.sizeTier}</td>
                      <td style={{padding:"9px 14px"}}><Text fontWeight={600} color="#16a34a">{row.provider}</Text><span style={iBadge}>instabee</span></td>
                      <td style={{padding:"9px 14px",fontWeight:700,color:"#16a34a"}}>From {priceStr(row.price)}</td>
                      <td style={{padding:"9px 14px",color:"#6b7280",fontSize:12}}>{row.desc}</td>
                      <td style={{padding:"9px 14px",textAlign:"right",color:"#6b7280",fontSize:12}}>{row.days}</td>
                    </>
                  ):(
                    <>
                      <td style={{padding:"9px 14px"}}><span style={posCircle(row.pos)}>{row.pos}</span></td>
                      <td style={{padding:"9px 14px"}}>
                        <Flex align="center" gap={1}><Text fontWeight={600} color="#0f172a">{row.provider}</Text>{row.cat==="instabee"&&<span style={iBadge}>instabee</span>}</Flex>
                        <Text fontSize="11px" color="#64748b">{row.desc}</Text>
                      </td>
                      <td style={{padding:"9px 14px",color:"#6b7280",fontSize:12}}>{row.days}</td>
                      <td style={{padding:"9px 14px",textAlign:"right",fontWeight:700,color:"#0f172a"}}>{priceStr(row.price)}</td>
                    </>
                  )}
                </tr>
              ))}
            </tbody>
          </table>
        </Box>
      </Box>
    );
  };

  const renderContent = () => {
    if (isGroup) {
      if (!activeBrandId||activeBrandId==="overview") return renderGroupOverview();
      const brand = activeClient.brands.find(b=>b.id===activeBrandId);
      return renderDetail(brand.id, brand.url, brand.status);
    }
    return renderDetail(activeClient.id, activeClient.url, activeClient.status);
  };

  const allEntities = [...clients.filter(c=>c.type==="single"),...clients.filter(c=>c.type==="group").flatMap(g=>g.brands)];
  const scanned = allEntities.filter(e=>e.status==="success").length;
  const issues  = allEntities.filter(e=>e.status!=="success").length;

  const wMeta = WEEK_META[activeWeek];

  return (
    <Box fontFamily="system-ui,sans-serif" bg="#f1f5f9" minH="100vh">
      {/* Header */}
      <Box bg="white" borderBottom="1px solid #e2e8f0" px={6} py={4}>
        <Flex align="center" justify="space-between" flexWrap="wrap" gap={3}>
          <Box>
            <Text fontSize="18px" fontWeight={800} color="#0f172a">📦 Checkout Monitor — Norway</Text>
            <Text fontSize="12px" color="#64748b">Instabee · Porterbuddy & Instabox · Weekly scan</Text>
          </Box>
          <Flex gap={3} align="center">
            {/* Week selector */}
            <Flex gap={1}>
              {WEEKS.map(w=>(
                <Box key={w} onClick={()=>{setActiveWeek(w);setActiveClientId("villoid");setActiveBrandId(null);}}
                  cursor="pointer" px={3} py={1} borderRadius="8px"
                  bg={activeWeek===w?"#7c3aed":"#f1f5f9"}
                  color={activeWeek===w?"white":"#64748b"}
                  fontSize="13px" fontWeight={activeWeek===w?700:400}>
                  {WEEK_META[w].label}
                </Box>
              ))}
            </Flex>
            <Box textAlign="center" px={3} py={1} bg="#dcfce7" borderRadius="8px">
              <Text fontSize="16px" fontWeight={700} color="#16a34a">{scanned}</Text>
              <Text fontSize="10px" color="#16a34a" fontWeight={600}>SCANNED</Text>
            </Box>
            <Box textAlign="center" px={3} py={1} bg="#fef3c7" borderRadius="8px">
              <Text fontSize="16px" fontWeight={700} color="#d97706">{issues}</Text>
              <Text fontSize="10px" color="#d97706" fontWeight={600}>ISSUES</Text>
            </Box>
          </Flex>
        </Flex>
        <Text fontSize="11px" color="#94a3b8" mt={1}>Scan date: {wMeta.scanDate}</Text>
      </Box>

      {/* Client tabs */}
      <Box bg="white" borderBottom="1px solid #e2e8f0" px={6} overflowX="auto">
        <Flex gap={0}>
          {clients.map(c=>{
            const active = activeClientId===c.id;
            const s = c.type==="group"?(c.brands.every(b=>b.status==="success")?"success":"partial"):c.status;
            return (
              <Box key={c.id} onClick={()=>{setActiveClientId(c.id);setActiveBrandId(c.type==="group"?"overview":null);}} cursor="pointer"
                px={4} py={3} borderBottom={active?"2px solid #7c3aed":"2px solid transparent"}
                color={active?"#7c3aed":"#64748b"} fontWeight={active?600:400} fontSize="13px" whiteSpace="nowrap">
                {c.name}{c.type==="group"&&<span style={{fontSize:10,color:"#9ca3af",marginLeft:3}}>▾</span>}{dot(s)}
              </Box>
            );
          })}
        </Flex>
      </Box>

      {/* Group sub-tabs */}
      {isGroup&&(
        <Box bg="#f8fafc" borderBottom="1px solid #e2e8f0" px={8} overflowX="auto">
          <Flex gap={0} align="center">
            <Text fontSize="11px" color="#94a3b8" fontWeight={600} mr={3}>{activeClient.name}:</Text>
            {["overview",...activeClient.brands.map(b=>b.id)].map(id=>{
              const brand = id==="overview"?null:activeClient.brands.find(b=>b.id===id);
              const lbl = id==="overview"?"Overview":brand.name;
              const active = (activeBrandId||"overview")===id;
              return (
                <Box key={id} onClick={()=>setActiveBrandId(id)} cursor="pointer" px={3} py={2}
                  borderBottom={active?"2px solid #0ea5e9":"2px solid transparent"}
                  color={active?"#0369a1":"#64748b"} fontWeight={active?600:400} fontSize="12px" whiteSpace="nowrap">
                  {lbl}{brand&&dot(brand.status)}
                </Box>
              );
            })}
          </Flex>
        </Box>
      )}

      <Box p={6}>{renderContent()}</Box>

      <Box textAlign="center" py={4} color="#94a3b8" fontSize="11px" borderTop="1px solid #e2e8f0">
        Checkout Monitor · Instabee Norway · Data updated weekly every Monday
      </Box>
    </Box>
  );
}


    /* ── Mount ────────────────────────────────────────────────────────────── */
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
